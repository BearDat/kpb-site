name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* values get baked into the client bundle at build time,
      # so they have to be real env vars here — a Cloudflare secret set later
      # (via `wrangler secret put`) is only available at request time and
      # would never reach the browser bundle.
      - name: Write build-time env
        run: |
          cat >> .env.production.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_LEAGUE_ID=${{ secrets.NEXT_PUBLIC_LEAGUE_ID }}
          EOF

      - name: Build and deploy
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
